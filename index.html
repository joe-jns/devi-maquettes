<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Avance pour toi – Maquette de la page de vente</title>
<meta name="theme-color" content="#4A1C1E">
<style>
  :root { --ink:#4A1C1E; --forest:#6B2A2C; --lime:#E8CFA6; --paper:#FAF5EE; --bar:44px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#2A1213; color:#fff; font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }

  .bar { position:sticky; top:0; z-index:50; height:var(--bar); display:flex; align-items:center; gap:16px; padding:0 16px; background:var(--ink); border-bottom:1px solid #ffffff14; }
  .tag { display:flex; align-items:center; gap:8px; white-space:nowrap; font-size:13px; color:#ffffffb3; }
  .tag b { color:#fff; font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--lime); flex:none; }
  .tabs { flex:1; display:flex; justify-content:center; gap:2px; }
  .tabs button { padding:6px 12px; border-radius:99px; font-size:13px; color:#ffffffa6; }
  .tabs button:hover { color:#fff; background:#ffffff12; }
  .tabs button[aria-current="true"] { color:var(--ink); background:var(--lime); font-weight:600; }
  .switch { display:flex; padding:3px; border-radius:99px; background:#ffffff14; }
  .switch button { padding:4px 12px; border-radius:99px; font-size:12px; color:#ffffffa6; }
  .switch button[aria-pressed="true"] { background:#fff; color:var(--ink); font-weight:600; }
  .pages-btn { display:none; margin-left:auto; padding:7px 14px; border-radius:99px; background:var(--lime); color:var(--ink); font-weight:600; font-size:13px; }

  .stage { display:flex; justify-content:center; padding:0; min-height:calc(100vh - var(--bar)); }
  .page { position:relative; width:100%; max-width:1440px; background:var(--paper); }
  .page img { display:block; width:100%; height:auto; }
  .mode-mobile .stage { padding:32px 16px 64px; }
  .mode-mobile .page { max-width:390px; border-radius:28px; overflow:hidden; box-shadow:0 30px 80px #0008, 0 0 0 8px #4A1C1E, 0 0 0 9px #ffffff22; }
  .touch.mode-mobile .stage { padding:0; }
  .touch.mode-mobile .page { max-width:none; border-radius:0; box-shadow:none; }

  .hs { position:absolute; display:block; border-radius:10px; cursor:pointer; }
  .hs:focus-visible { outline:2px solid var(--lime); outline-offset:2px; }
  .flash .hs { background:#E8CFA640; box-shadow:0 0 0 2px #C4A57F; transition:background .15s; }

  .sheet { position:fixed; inset:0; z-index:60; display:none; background:#0009; }
  .sheet.open { display:flex; align-items:flex-end; }
  .sheet-inner { width:100%; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); background:var(--ink); border-radius:20px 20px 0 0; }
  .sheet h2 { font-size:12px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:#ffffff80; margin:0 4px 10px; }
  .sheet-inner button.p { display:flex; width:100%; justify-content:space-between; padding:14px 12px; border-radius:12px; font-size:17px; }
  .sheet-inner button.p[aria-current="true"] { background:var(--forest); color:var(--lime); }
  .sheet-inner .alt { margin-top:10px; width:100%; padding:12px; font-size:13px; color:#ffffff99; }

  .hint { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:40; padding:9px 16px; border-radius:99px; background:var(--ink); color:#ffffffcc; font-size:12.5px; box-shadow:0 8px 30px #0006; transition:opacity .4s; pointer-events:none; white-space:nowrap; }
  .hint.hide { opacity:0; }

  @media (max-width:980px) { .tabs button { padding:6px 8px; } .tag .long { display:none; } }
  @media (max-width:820px) {
    .tabs, .switch { display:none; }
    .pages-btn { display:block; }
  }
</style>
</head>
<body>
  <header class="bar">
    <div class="tag"><span class="dot"></span><b>Avance pour toi</b><span class="long">· Maquette – version de travail</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="switch" id="switch">
      <button data-mode="desktop">Ordinateur</button>
      <button data-mode="mobile">Mobile</button>
    </div>
    <button class="pages-btn" id="pagesBtn">Pages</button>
  </header>

  <main class="stage"><div class="page" id="page"><img id="img" alt=""></div></main>

  <div class="sheet" id="sheet">
    <div class="sheet-inner">
      <h2>Pages</h2>
      <div id="sheetList"></div>
      <button class="alt" id="altMode"></button>
    </div>
  </div>

  <div class="hint" id="hint">Cliquez sur les boutons pour naviguer</div>

<script>
const PAGES = [["page-de-vente","Page de vente"]];
// Cible "@y" = descendre à la hauteur y de la maquette ; "!rdv" = le futur lien de prise de rendez-vous.
const DATA = {"desktop":{"page-de-vente":{"w":1440,"h":8248,"links":[["@7369",120,562,413,66],["@7369",514,1718,413,66],["@7369",636,5311,413,66],["!rdv",514,7813,413,66]]}},"mobile":{"page-de-vente":{"w":390,"h":9116,"links":[["@8151",24,378,342,56],["@8151",48,1870,294,56],["@8151",24,5906,342,56],["!rdv",48,8699,294,56]]}}};

const $ = id => document.getElementById(id);
const smallScreen = matchMedia("(max-width:820px)");
const vue = new URLSearchParams(location.search).get("vue");
let override = vue === "mobile" ? "mobile" : vue === "ordinateur" ? "desktop" : sessionStorage.getItem("mode");
let current = null, mode = null;

const label = slug => PAGES.find(p => p[0] === slug)[1];
const slugFromHash = () => { const s = location.hash.replace(/^#\/?/, ""); return DATA.desktop[s] ? s : PAGES[0][0]; };
const pickMode = () => override || (smallScreen.matches ? "mobile" : "desktop");

$("tabs").innerHTML = PAGES.map(([s, l]) => `<button data-page="${s}">${l}</button>`).join("");
$("sheetList").innerHTML = PAGES.map(([s, l]) => `<button class="p" data-page="${s}"><span>${l}</span><span>›</span></button>`).join("");

function render() {
  const slug = slugFromHash(), m = pickMode();
  const changed = slug !== current || m !== mode;
  current = slug; mode = m;
  document.body.classList.toggle("mode-mobile", m === "mobile");
  document.body.classList.toggle("touch", smallScreen.matches);
  document.title = `${label(slug)} – Avance pour toi (maquette)`;
  document.querySelectorAll("[data-page]").forEach(b => b.setAttribute("aria-current", b.dataset.page === slug));
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  $("altMode").textContent = m === "mobile" ? "Voir la version ordinateur" : "Voir la version mobile";
  if (!changed) return;

  const d = DATA[m][slug], page = $("page"), img = $("img");
  page.style.aspectRatio = `${d.w} / ${d.h}`;
  img.src = `img/${m}/${slug}.jpg`;
  img.alt = `Maquette ${m === "mobile" ? "mobile" : "ordinateur"} – ${label(slug)}`;
  page.querySelectorAll(".hs").forEach(a => a.remove());
  for (const [to, x, y, w, h] of d.links) {
    const a = document.createElement("a");
    a.className = "hs";
    const special = to === "#menu" || to[0] === "@" || to[0] === "!";
    a.href = special ? "#" : `#/${to}`;
    a.setAttribute("aria-label", to === "#menu" ? "Menu" : to[0] === "@" ? "Aller à la prise de rendez-vous" : to[0] === "!" ? "Prendre rendez-vous" : label(to));
    if (to === "#menu") a.addEventListener("click", e => { e.preventDefault(); openSheet(); });
    if (to[0] === "@") a.addEventListener("click", e => { e.preventDefault(); const r = page.getBoundingClientRect(); window.scrollTo({ top: scrollY + r.top + to.slice(1) / d.h * r.height - 64, behavior: "smooth" }); });
    if (to[0] === "!") a.addEventListener("click", e => { e.preventDefault(); showHint("Ici : lien vers la prise de rendez-vous en ligne"); });
    Object.assign(a.style, { left: `${x / d.w * 100}%`, top: `${y / d.h * 100}%`, width: `${w / d.w * 100}%`, height: `${h / d.h * 100}%` });
    page.appendChild(a);
  }
  window.scrollTo(0, 0);
  img.onload = preload;
}

function preload() {
  for (const [s] of PAGES) if (s !== current) new Image().src = `img/${mode}/${s}.jpg`;
}

const openSheet = () => $("sheet").classList.add("open");
const closeSheet = () => $("sheet").classList.remove("open");
const go = slug => { closeSheet(); if (slugFromHash() === slug) window.scrollTo({ top: 0, behavior: "smooth" }); else location.hash = `/${slug}`; };

document.addEventListener("click", e => {
  const p = e.target.closest("[data-page]");
  if (p) return go(p.dataset.page);
  const hs = e.target.closest(".hs");
  if (hs && hs.getAttribute("href") === location.hash) { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (e.target.id === "img") {
    const page = $("page");
    page.classList.add("flash");
    setTimeout(() => page.classList.remove("flash"), 450);
  }
});
document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { override = b.dataset.mode; sessionStorage.setItem("mode", override); render(); }));
$("altMode").addEventListener("click", () => { override = mode === "mobile" ? "desktop" : "mobile"; sessionStorage.setItem("mode", override); closeSheet(); render(); });
$("pagesBtn").addEventListener("click", openSheet);
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
addEventListener("hashchange", render);
smallScreen.addEventListener("change", render);

render();
if (/debug/.test(location.search)) $("page").classList.add("flash");
let hintTimer = setTimeout(() => $("hint").classList.add("hide"), 4000);
function showHint(t) { const h = $("hint"); h.textContent = t; h.classList.remove("hide"); clearTimeout(hintTimer); hintTimer = setTimeout(() => h.classList.add("hide"), 3000); }
</script>
</body>
</html>
